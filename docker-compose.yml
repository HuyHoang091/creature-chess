version: "3.8"

networks:
  creature-chess:
    name: creature-chess
    driver: bridge

volumes:
  pgdata:
  pgadmin:

services:
  # ==========================================
  # Redis Database (For Socket Cluster)
  # ==========================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - creature-chess
    restart: unless-stopped

  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:13.9
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 20
    networks:
      - creature-chess
    restart: unless-stopped

  # ==========================================
  # pgAdmin (quản lý DB qua web)
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=root
    ports:
      - "5050:80"
    networks:
      - creature-chess
    volumes:
      - pgadmin:/root/.pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # App - Creature Chess (game + info + web)
  # ==========================================
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   environment:
  #     - NODE_ENV=${NODE_ENV}
  #     - AUTH0_ENABLED=${AUTH0_ENABLED}
  #     - AUTH0_DOMAIN=${AUTH0_DOMAIN}
  #     - AUTH0_SPA_CLIENT_ID=${AUTH0_SPA_CLIENT_ID}
  #     - AUTH0_MACHINE_TO_MACHINE_CLIENT_ID=${AUTH0_MACHINE_TO_MACHINE_CLIENT_ID}
  #     - AUTH0_MANAGEMENT_CLIENT_SECRET=${AUTH0_MANAGEMENT_CLIENT_SECRET}
  #     - CREATURE_CHESS_APP_URL=${CREATURE_CHESS_APP_URL}
  #     - GAME_SERVER_URL=${GAME_SERVER_URL}
  #     - API_INFO_URL=${API_INFO_URL}
  #     - CREATURE_CHESS_IMAGE_URL=${CREATURE_CHESS_IMAGE_URL}
  #     - DATABASE_URL=${DATABASE_URL}
  #     - POSTGRES_DB=${POSTGRES_DB}
  #     - POSTGRES_USER=${POSTGRES_USER}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  #     - NODE_APP_INSTANCE=${NODE_APP_INSTANCE}
  #     - METRICS_USERNAME=${METRICS_USERNAME}
  #     - METRICS_PASSWORD=${METRICS_PASSWORD}

  #     - REDIS_URL=${REDIS_URL}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_started
  #   networks:
  #     - creature-chess
  #   restart: unless-stopped
  #   # Debug
  #   ulimits:
  #     nofile:
  #       soft: 300000
  #       hard: 300000

  server-info:
    build: .
    command: yarn start-server-info
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - postgres
    networks:
      - creature-chess
    restart: unless-stopped

  server-game:
    build: .
    command: yarn start-server-game
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - creature-chess
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 300000
        hard: 300000

  frontend:
    build: .
    command: yarn dev-web-game
    networks:
      - creature-chess
    restart: unless-stopped

  # ==========================================
  # Nginx Reverse Proxy (HTTP only, không SSL)
  # ==========================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/production/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./images:/usr/share/nginx/html/images:ro
    depends_on:
      # - app
      - server-info
      - server-game
      - frontend
    networks:
      - creature-chess
    restart: unless-stopped
    # Debug
    ulimits:
      nofile:
        soft: 300000
        hard: 300000

  # ==========================================
  # Cloudflare Tunnel - Bảo mật & SSL miễn phí
  # ==========================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - creature-chess
    restart: unless-stopped
    # Debug
    ulimits:
      nofile:
        soft: 300000
        hard: 300000
