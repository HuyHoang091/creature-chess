version: "3.8"

networks:
  creature-chess:
    name: creature-chess
    driver: bridge

volumes:
  pgdata:
  pgadmin:

services:
  # ==========================================
  # Redis Database (For Socket Cluster)
  # ==========================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - creature-chess
    restart: unless-stopped
    labels:
      - "sdo.managed=true"
      - "sdo.service=redis"
      - "sdo.tier=1"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:13.9
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 20
    networks:
      - creature-chess
    restart: unless-stopped
    labels:
      - "sdo.managed=true"
      - "sdo.service=postgres"
      - "sdo.tier=1"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ==========================================
  # pgAdmin (quản lý DB qua web)
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=root
    ports:
      - "5050:80"
    networks:
      - creature-chess
    volumes:
      - pgadmin:/root/.pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # App - Creature Chess (game + info + web)
  # ==========================================
  server-info:
    build: .
    command: yarn start-server-info
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - postgres
    networks:
      - creature-chess
    restart: unless-stopped
    labels:
      - "sdo.managed=true"
      - "sdo.service=server-info"
      - "sdo.tier=2"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M

  server-game:
    build: .
    command: yarn start-server-game
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      RAG_SERVICE_URL: ${RAG_SERVICE_URL}
    depends_on:
      - postgres
      - redis
    networks:
      - creature-chess
    restart: unless-stopped
    labels:
      - "sdo.managed=true"
      - "sdo.service=server-game"
      - "sdo.tier=2"
    ulimits:
      nofile:
        soft: 300000
        hard: 300000
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M

  frontend:
    build: .
    command: yarn dev-web-game
    networks:
      - creature-chess
    restart: unless-stopped
    labels:
      - "sdo.managed=true"
      - "sdo.service=frontend"
      - "sdo.tier=3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M

  server-admin:
    build: .
    command: yarn start-server-admin
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - creature-chess
    restart: unless-stopped

  admin-web:
    build: .
    command: yarn dev-admin-web
    networks:
      - creature-chess
    restart: unless-stopped

  ssh-bastion:
    image: alpine:latest
    command: sh -c "apk add --no-cache openssh && ssh-keygen -A && echo 'root:adminpass' | chpasswd && sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config && sed -i 's/AllowTcpForwarding no/AllowTcpForwarding yes/g' /etc/ssh/sshd_config && /usr/sbin/sshd -D"
    ports:
      - "2222:22"
    networks:
      - creature-chess
    restart: unless-stopped

  # ==========================================
  # Nginx Reverse Proxy (HTTP only, không SSL)
  # ==========================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/production/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./images:/usr/share/nginx/html/images:ro
    depends_on:
      # - app
      - server-info
      - server-game
      - frontend
    networks:
      - creature-chess
    restart: unless-stopped
    # Debug
    ulimits:
      nofile:
        soft: 300000
        hard: 300000

  # ==========================================
  # Cloudflare Tunnel - Bảo mật & SSL miễn phí
  # ==========================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - creature-chess
    restart: unless-stopped
    # Debug
    ulimits:
      nofile:
        soft: 300000
        hard: 300000

  # ==========================================
  # Service Docker Orchestrator (SDO v3.0)
  # ==========================================
  sdo:
    image: sdo:latest
    privileged: true
    restart: unless-stopped
    volumes:
      - ./sdo.yml:/app/sdo.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /:/host:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    environment:
      - SDO_PROBE_ENABLED=false # Thêm dòng này để tắt tính năng Probe sai lệch
      - SDO_CONFIG=/app/sdo.yml
      - SDO_AGENT_MODE=dry-run # Mặc định để dry-run, bạn có thể đổi thành live
      - SDO_PROM_PORT=9090
      - SDO_METRICS_PORT=9200
      - SDO_CADVISOR_PORT=8080
      - SDO_NODE_EXPORTER_PORT=9100
      - SDO_DASHBOARD_PORT=9300
      - PYTHONUNBUFFERED=1
      - SDO_COMPOSE_FILE=/app/docker-compose.yml
    ports:
      - "5174:80" # SDO UI
      - "9090:9090" # Prometheus
      - "8080:8080" # cAdvisor
      - "9100:9100" # Node Exporter
      - "9200:9200" # SDO Agent
      - "9300:9300" # SDO Dashboard
    networks:
      - creature-chess
