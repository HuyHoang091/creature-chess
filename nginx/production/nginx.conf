worker_processes auto;
worker_rlimit_nofile 300000;

events {
    # worker_connections 1024;
	worker_connections 100000;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;

	upstream app_game {
		least_conn;
		# ip_hash;
        server app:3001;
    }

    upstream app_frontend {
        server app:8090;
    }

    upstream app_api {
        server app:3000;
    }

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name covuasinhvat.xyz www.covuasinhvat.xyz localhost;

        # Serve static images
        location /images/ {
            root /usr/share/nginx/html/;
        }

        # WebSocket proxy cho game server (port 3001)
        location /game/socket.io/ {
            proxy_pass http://app_game/socket.io/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

			proxy_set_header Authorization $http_authorization;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

			proxy_read_timeout 600s;
        }

        # Prometheus metrics (game server - port 3001)
        location /metrics {
            proxy_pass http://app_game/metrics;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API proxy cho server-info (port 3000)
        location /api/ {
            proxy_pass http://app_api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend - webpack dev server (port 8090)
        location / {
            proxy_pass http://app_frontend/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
