worker_processes auto;
worker_rlimit_nofile 300000;

events {
    # worker_connections 1024;
	worker_connections 100000;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;

	# Chú ý: Đã xóa các block upstream tĩnh để dùng DNS Docker động

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name covuasinhvat.xyz www.covuasinhvat.xyz localhost;

        # Thêm Docker DNS resolver để tự động cập nhật IP khi SDO scale container
        resolver 127.0.0.11 valid=5s;

        # Serve static images
        location /images/ {
            root /usr/share/nginx/html/;
        }

        # WebSocket proxy cho game server (port 3001)
        location /game/socket.io/ {
            set $upstream_game "server-game:3001";
            rewrite ^/game(/.*)$ $1 break;
            proxy_pass http://$upstream_game;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

			proxy_set_header Authorization $http_authorization;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

			proxy_read_timeout 600s;
        }

        # Prometheus metrics (game server - port 3001)
        location /metrics {
            set $upstream_game "server-game:3001";
            proxy_pass http://$upstream_game;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API proxy cho server-info (port 3002)
        location /api/ {
            set $upstream_api "server-info:3002";
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend - webpack dev server (port 8090)
        location / {
            set $upstream_frontend "frontend:8090";
            proxy_pass http://$upstream_frontend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


		location /ai/ {
            # Chú ý: dùng host.docker.internal thay vì localhost
            proxy_pass http://host.docker.internal:8003/;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
