<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creature Chess Dark CGI Background Preview</title>
  <link rel="stylesheet" href="./majestic-background-preview.css" />
</head>
<body>
  <main class="scene-shell">
    <canvas id="scene" aria-label="Animated background preview"></canvas>

    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="godray godray-left"></div>
    <div class="godray godray-right"></div>

    <section class="hud">
      <p class="eyebrow">Creature Chess Dark Preview</p>
      <h1>Dread sky citadel battlefield backdrop</h1>
      <p class="description">
        Separate preview file for a darker fantasy CGI-style background. It is designed
        to feel ancient, ominous, and tactical before being integrated into the game UI.
      </p>
      <div class="legend">
        <span>cold aurora</span>
        <span>haunted citadel</span>
        <span>poison mist</span>
        <span>wraith motes</span>
      </div>
    </section>
  </main>

  <script src="./majestic-background-preview.js"></script>
</body>
</html>
