<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creature Chess Arcane Battlefield Preview</title>
  <link rel="stylesheet" href="./desktop-battlefield-preview.css" />
</head>
<body class="theme-arcane" data-theme="arcane">
  <main class="desktop-shell">
    <canvas id="arena-scene" aria-label="Desktop battle arena background preview"></canvas>

    <div class="game-frame">
      <header class="topbar"></header>

      <aside class="synergy">
      </aside>

      <section class="board-stage">
        <div class="board-backdrop">
          <div class="arena-ring arena-ring-outer"></div>
          <div class="arena-ring arena-ring-mid"></div>
          <div class="arena-ring arena-ring-inner"></div>
          <div class="arena-core-glow"></div>
          <div class="arena-runes"></div>
          <div class="sky-island island-a">
            <span class="island-body"></span>
            <span class="hut hut-a"></span>
            <span class="tree tree-a"></span>
          </div>
          <div class="sky-island island-b">
            <span class="island-body"></span>
            <span class="hut hut-b"></span>
            <span class="tree tree-b"></span>
          </div>
          <div class="sky-island island-c">
            <span class="island-body"></span>
            <span class="hut hut-c"></span>
          </div>
          <div class="sky-island island-d">
            <span class="island-body"></span>
            <span class="hut hut-d"></span>
            <span class="tree tree-c"></span>
          </div>
          <div class="sky-island island-e">
            <span class="island-body"></span>
            <span class="tree tree-d"></span>
          </div>
        </div>
        <div class="board-shell">
        </div>
      </section>

      <aside class="players">
      </aside>

      <section class="controls">
      </section>

      <section class="shop">
      </section>
    </div>

    <div class="vignette"></div>
    <div class="grain"></div>
  </main>

  <script src="./desktop-battlefield-preview.js"></script>
</body>
</html>
